  /admin/suppliers/supply-requests/{id}:
    patch:
      summary: Advance or reject a supplier supply request
      tags: [Supplier Dashboard]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [UNDER_REVIEW, APPROVED, SOURCING, IN_TRANSIT, RECEIVED, REJECTED]
