  /admin/suppliers/payouts:
    get:
      summary: List pending supplier payouts
      tags: [Supplier Dashboard]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Supplier payout requests awaiting processing

  /admin/suppliers/payouts/{id}:
    patch:
      summary: Process or reject a supplier payout
      tags: [Supplier Dashboard]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [PROCESSING, PAID, REJECTED, FAILED]
                reason:
                  type: string
      responses:
        '200':
          description: Payout status updated
        '409':
          description: Payout cannot be processed from its current status

# ==========================================
# REUSABLE COMPONENTS & SCHEMAS
# ==========================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    AddressInput:
      type: object
      required: [street, city, state, country]
      properties:
        street:
          type: string
          example: "KN 5 Rd"
        city:
          type: string
          example: "Kigali"
        state:
          type: string
          example: "Kigali City"
        country:
          type: string
          example: "Rwanda"
        postalCode:
          type: string
          example: "00250"

    ProductInput:
      type: object
      required: [name, price, stockQuantity]
      properties:
        name:
          type: string
          example: "Wireless Headphones"
        description:
          type: string
        price:
          type: number
          example: 45000
        stockQuantity:
          type: integer
          example: 20
        category:
          type: string
          example: "Electronics"
        moq:
          type: integer
          default: 1
        status:
          type: string
          enum: [ACTIVE, INACTIVE, OUT_OF_STOCK]
          default: "ACTIVE"

    StoreInput:
      type: object
      required: [storeName, contactEmail, contactPhone]
      properties:
        storeName:
          type: string
          example: "Kigali Tech Hub"
        description:
          type: string
        businessCategory:
          type: string
          example: "Electronics"
        contactEmail:
          type: string
          example: "support@kigalitech.rw"
        contactPhone:
          type: string
          example: "+250788123456"
        address:
          $ref: '#/components/schemas/AddressInput'