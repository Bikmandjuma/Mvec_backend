      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                comment:
                  type: string
      responses:
        '201':
          description: Supplier review created
        '403':
          description: Completed wholesale order required

  /admin/suppliers/supply-requests:
    get:
