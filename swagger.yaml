      parameters:
        - in: path
          name: payoutId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [COMPLETED, REJECTED]
                transactionReference:
                  type: string
                rejectionReason:
                  type: string
      responses:
