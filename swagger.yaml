openapi: 3.0.0
info:
  title: MVEC Multi-Vendor Marketplace API
  description: Consolidated OpenAPI 3.0 specification covering Authentication, Cart, Orders, Products, Stores, Staff Management, Double-Entry Ledger, Commission Rules, Payment Webhooks, B2B Wholesale, Disputes & Arbitration, Affiliate Marketing Engine, and the Supplier Dashboard.
  version: 1.0.0
servers:
  - url: http://localhost:4000/api
    description: Local Development Server

paths:

  # ==========================================
  # AUTHENTICATION & PROFILE ROUTES
  # ==========================================
  /auth/register:
    post:
      summary: Register User
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [Fullname, email, password]
              properties:
                Fullname:
                  type: string
                  example: "John Doe"
                email:
                  type: string
                  example: "john@example.com"
                password:
                  type: string
                  example: "Password123!"
                role:
                  type: string
                  enum: [buyer, vendor, courier]
                  default: "buyer"
                staffInviteToken:
                  type: string
                  description: One-time token from a vendor-team invitation email. Completes registration as a team member.
      responses:
        '201':
          description: User registered successfully
        '400':
          description: Registration error or missing fields

  /auth/login:
    post:
      summary: Login User
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  example: "user@example.com"
                password:
                  type: string
                  example: "Password123!"
                staffInviteToken:
                  type: string
                  description: One-time token from a vendor-team invitation email. Accepts the invitation after sign-in.
      responses:
        '200':
          description: Successfully authenticated (Returns JWT)
        '401':
          description: Invalid credentials

  /auth/google-login:
    post:
      summary: Google Social OAuth Login
      description: Verifies a Google ID token (issued by Google Identity Services on the frontend), creates or links a user, and returns a JWT.
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                idToken:
                  type: string
                  example: "eyJhbGciOi..."
                role:
                  type: string
                  enum: [buyer, vendor, supplier, affiliate]
                  default: buyer
      responses:
        '200':
          description: Google authentication successful
        '401':
          description: Invalid Google ID token
        '500':
          description: Google client not configured or server error

  /auth/forgot-password:
    post:
      summary: Request Password Reset Link
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  example: "user@example.com"
      responses:
        '200':
          description: Reset token sent to email

  /auth/reset-password/{token}:
    post:
      summary: Reset Password using Token
      tags: [Authentication]
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  example: "NewSecurePassword123!"
      responses:
        '200':
          description: Password reset successful

  /auth/send-otp:
    post:
      summary: Send Phone OTP Verification Code
      description: Sends a 6-digit one-time code to a Rwandan phone number for phone-based registration or passwordless login.
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, purpose]
              properties:
                phone:
                  type: string
                  example: "0788123456"
                purpose:
                  type: string
                  enum: [registration, login]
                  example: "login"
                email:
                  type: string
                  example: "user@example.com"
      responses:
        '200':
          description: Verification code sent (includes devCode in development)
        '400':
          description: Invalid phone number or purpose
        '429':
          description: Too many requests — wait for the cooldown before resending

  /auth/verify-otp:
    post:
      summary: Verify Phone OTP Code
      description: Validates the OTP. For purpose "login" it signs the user in (passwordless). For purpose "registration" it returns a short-lived verificationToken for completing sign-up.
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code, purpose]
              properties:
                phone:
                  type: string
                  example: "0788123456"
                code:
                  type: string
                  example: "123456"
                purpose:
                  type: string
                  enum: [registration, login]
                  example: "login"
                role:
                  type: string
                  enum: [buyer, vendor, supplier, affiliate]
                  default: buyer
      responses:
        '200':
          description: Code verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  verified:
                    type: boolean
                  verificationToken:
                    type: string
                    description: Only returned on purpose "registration"
                  user:
                    type: object
                    description: Only returned on purpose "login"
                  token:
                    type: string
                    description: Only returned on purpose "login"
        '400':
          description: Invalid or expired code
        '404':
          description: No account linked to this phone (passwordless login)
        '429':
          description: Too many failed attempts

  /auth/addresses:
    get:
      summary: Get User Saved Addresses
      tags: [User Addresses]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Saved address list returned

    post:
      summary: Add New User Address
      tags: [User Addresses]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressInput'
      responses:
        '201':
          description: Address created

  /auth/addresses/{addressId}:
    put:
      summary: Update Address
      tags: [User Addresses]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: addressId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressInput'
      responses:
        '200':
          description: Address updated

    delete:
      summary: Delete Address
      tags: [User Addresses]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: addressId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Address deleted

  # ==========================================
  # CART ROUTES
  # ==========================================
  /cart:
    get:
      summary: Fetch Shopping Cart
      tags: [Cart]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Cart object returned

    post:
      summary: Add Item to Cart
      tags: [Cart]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, quantity]
              properties:
                productId:
                  type: string
                quantity:
                  type: integer
                  example: 1
      responses:
        '200':
          description: Item added to cart

    delete:
      summary: Clear Cart
      tags: [Cart]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Cart emptied successfully

  /cart/items/{productId}:
    put:
      summary: Update Cart Item Quantity
      tags: [Cart]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity:
                  type: integer
                  example: 3
      responses:
        '200':
          description: Quantity updated

    delete:
      summary: Remove Item from Cart
      tags: [Cart]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Item removed from cart

  # ==========================================
  # ORDER ROUTES
  # ==========================================
  /orders/checkout:
    post:
      summary: Create Checkout Order
      tags: [Orders]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shippingAddress]
              properties:
                shippingAddress:
                  $ref: '#/components/schemas/AddressInput'
                paymentMethod:
                  type: string
                  enum: [CARD, PAYSTACK, STRIPE, MOMO, CASH_ON_DELIVERY]
                  default: "MOMO"
      responses:
        '201':
          description: Order created successfully

  /orders/my-orders:
    get:
      summary: Get Logged-in Buyer Orders
      tags: [Orders]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of buyer orders

  /orders/vendor/orders:
    get:
      summary: Get Vendor Orders (Vendor Only)
      tags: [Orders]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of vendor orders
        '403':
          description: Access denied

  /orders/vendor/status:
    patch:
      summary: Update Order Status (Vendor & Staff Permission)
      tags: [Orders]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId]
              properties:
                orderId:
                  type: string
                status:
                  type: string
                  enum: [PENDING, CONFIRMED, PROCESSING, READY_FOR_SHIPMENT, SHIPPED, DELIVERED, CANCELLED, RETURNED, REFUNDED, FAILED]
                paymentStatus:
                  type: string
                  enum: [PENDING, CONFIRMED, PAID, FAILED, REFUNDED]
      responses:
        '200':
          description: Status updated

  /orders/{id}:
    get:
      summary: Get Order Details by ID
      tags: [Orders]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order object returned
        '404':
          description: Order not found

  /orders/{id}/status:
    patch:
      summary: General Order Status Update (Admin & Vendor)
      tags: [Orders]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
      responses:
        '200':
          description: Order status updated

  /orders/{id}/deliver:
    patch:
      summary: Confirm Order Delivery and Trigger Escrow Payout (Super Admin & Courier)
      tags: [Orders]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Delivery confirmed and earnings released

  # ==========================================
  # PRODUCT ROUTES
  # ==========================================
  /products:
    get:
      summary: Get All Products (Public)
      tags: [Products]
      responses:
        '200':
          description: List of active products

    post:
      summary: Create Product (Vendor, Admin & Staff Permission)
      tags: [Products]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: Product created successfully

  /products/slug/{slug}:
    get:
      summary: Get Product by Slug (Public)
      tags: [Products]
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product details

  /products/vendor/me:
    get:
      summary: Get Logged-in Vendor's Products (Vendor Only)
      tags: [Products]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of products owned by vendor

  /products/{id}:
    get:
      summary: Get Product by ID (Public)
      tags: [Products]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product details

    put:
      summary: Update Product (Vendor, Admin & Staff Permission)
      tags: [Products]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '200':
          description: Product updated

    delete:
      summary: Delete Product (Vendor, Admin & Staff Permission)
      tags: [Products]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product deleted

  # ==========================================
  # STORE ROUTES
  # ==========================================
  /stores/public/{slug}:
    get:
      summary: Get Public Store Profile and Listed Products (Public)
      tags: [Stores]
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Public store profile and listed items

  /stores:
    post:
      summary: Create Store Profile (Vendor Only)
      tags: [Stores]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreInput'
      responses:
        '201':
          description: Store created successfully

  /stores/mine:
    get:
      summary: Get Logged-in Vendor Store Details (Vendor Only)
      tags: [Stores]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Store profile object

    put:
      summary: Update Store Details (Vendor Only)
      tags: [Stores]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                contactPhone:
                  type: string
                socialLinks:
                  type: object
      responses:
        '200':
          description: Store updated successfully

  # ==========================================
  # VENDOR ACCOUNT TEAM ROUTES
  # ==========================================
  /staff:
    get:
      summary: Get Vendor Account Team Members
      tags: [Vendor Team]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of staff assigned to the authenticated vendor account. A store is not required.

    post:
      summary: Add Vendor Account Team Member
      tags: [Vendor Team]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                role:
                  type: string
                  enum: [STORE_MANAGER, ORDER_MANAGER, CATALOG_MANAGER]
                permissions:
                  type: object
                  properties:
                    canManageOrders:
                      type: boolean
                    canManageProducts:
                      type: boolean
      responses:
        '201':
          description: |
            Staff member assigned to the vendor account. The email must belong
            to an existing MVEC account. MVEC sends the member a sign-in invitation.

  /staff/{id}:
    put:
      summary: Update Staff Member Permissions
      tags: [Vendor Team]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                permissions:
                  type: object
      responses:
        '200':
          description: Permissions updated

    delete:
      summary: Remove Staff Member
      tags: [Vendor Team]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Staff member removed

  # ==========================================
  # PAYMENT & WEBHOOK ROUTES
  # ==========================================
  /payments/pay:
    post:
      summary: Initiate Mobile Money Payment via Paypack (MTN or Airtel, auto-detected)
      tags: [Payments]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, phoneNumber]
              properties:
                orderId:
                  type: string
                  example: "665f1c2e8a1b2c3d4e5f6789"
                phoneNumber:
                  type: string
                  example: "0788123456"
      responses:
        '200':
          description: Payment prompt sent to the phone. Poll /payments/status/{paymentId} for the result.
        '400':
          description: Invalid phone number, wrong network, or order already paid
        '404':
          description: Order not found
        '502':
          description: Paypack could not be reached or rejected the request

  /payments/pay/momo:
    post:
      summary: Initiate MTN MoMo Payment via Paypack (MTN numbers only)
      tags: [Payments]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, phoneNumber]
              properties:
                orderId:
                  type: string
                  example: "665f1c2e8a1b2c3d4e5f6789"
                phoneNumber:
                  type: string
                  example: "0788123456"
      responses:
        '200':
          description: Payment prompt sent to the phone. Poll /payments/status/{paymentId} for the result.
        '400':
          description: Invalid phone number, wrong network, or order already paid
        '404':
          description: Order not found
        '502':
          description: Paypack could not be reached or rejected the request

  /payments/pay/airtel:
    post:
      summary: Initiate Airtel Money Payment via Paypack (Airtel numbers only)
      tags: [Payments]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, phoneNumber]
              properties:
                orderId:
                  type: string
                  example: "665f1c2e8a1b2c3d4e5f6789"
                phoneNumber:
                  type: string
                  example: "0733123456"
      responses:
        '200':
          description: Payment prompt sent to the phone. Poll /payments/status/{paymentId} for the result.
        '400':
          description: Invalid phone number, wrong network, or order already paid
        '404':
          description: Order not found
        '502':
          description: Paypack could not be reached or rejected the request

  /payments/status/{paymentId}:
    get:
      summary: Check Payment Status (reconciles with Paypack while pending)
      tags: [Payments]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: paymentId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Current payment and order status
        '404':
          description: Payment not found

  /webhooks/paypack:
    post:
      summary: Paypack Payment Webhook (verified via X-Paypack-Signature)
      tags: [Payments]
      parameters:
        - in: header
          name: X-Paypack-Signature
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event_id:
                  type: string
                event_kind:
                  type: string
                  example: "transaction:processed"
                data:
                  type: object
                  properties:
                    ref:
                      type: string
                    kind:
                      type: string
                      example: CASHIN
                    amount:
                      type: number
                    status:
                      type: string
                      enum: [pending, successful, failed]
      responses:
        '200':
          description: Webhook processed or ignored
        '401':
          description: Invalid signature
        '404':
          description: No payment matches the transaction ref

  # ==========================================
  # VENDOR PAYOUT ROUTES
  # ==========================================
  /payouts/balance:
    get:
      summary: Get Vendor Financial Balance (Vendor Only)
      tags: [Payouts]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Vendor ledger balance object

  /payouts/request:
    post:
      summary: Request Payout / Withdrawal (Vendor Only)
      tags: [Payouts]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, payoutDetails]
              properties:
                amount:
                  type: number
                  example: 50000
                payoutMethod:
                  type: string
                  enum: [MOBILE_MONEY, BANK_TRANSFER]
                payoutDetails:
                  type: object
                  properties:
                    accountName:
                      type: string
                    accountNumber:
                      type: string
      responses:
        '201':
          description: Payout requested

  /payouts/history:
    get:
      summary: Get Payout Request History (Vendor Only)
      tags: [Payouts]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: History of vendor payouts

  # ==========================================
  # COMMISSION MANAGEMENT (SUPER ADMIN)
  # ==========================================
  /commissions:
    get:
      summary: Fetch Commission Rules (Super Admin Only)
      tags: [Commissions (Admin)]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of category/vendor commission rules

    post:
      summary: Create Commission Rule (Super Admin Only)
      tags: [Commissions (Admin)]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [percentage]
              properties:
                category:
                  type: string
                vendor:
                  type: string
                percentage:
                  type: number
                  example: 10
                fixedFee:
                  type: number
                  example: 500
      responses:
        '201':
          description: Commission rule created

  /commissions/{id}/toggle:
    patch:
      summary: Toggle Active Status of Commission Rule (Super Admin Only)
      tags: [Commissions (Admin)]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Status toggled

  # ==========================================
  # FINANCIAL LEDGER & ESCROW (SUPER ADMIN)
  # ==========================================
  /financial/ledger:
    get:
      summary: Get Double-Entry Ledger Entries (Super Admin Only)
      tags: [Financial Ledger (Admin)]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Audit ledger entries list

  /financial/settlements/{id}/hold:
    patch:
      summary: Place Administrative Hold on Vendor Settlement (Super Admin Only)
      tags: [Financial Ledger (Admin)]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Administrative hold applied

  /financial/settlements/{id}/release:
    post:
      summary: Manually Release Escrow Settlement (Super Admin Only)
      tags: [Financial Ledger (Admin)]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Escrow funds manually released

  # ==========================================
  # B2B WHOLESALE ROUTES
  # ==========================================
  /wholesale/orders:
    post:
      summary: Create B2B Wholesale Order (MOQ Enforced)
      tags: [Wholesale B2B]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [supplierId, items]
              properties:
                supplierId:
                  type: string
                items:
                  type: array
                  items:
                    type: object
                    required: [product, productName, unitPrice, quantity, moq]
                    properties:
                      product:
                        type: string
                      productName:
                        type: string
                      unitPrice:
                        type: number
                      quantity:
                        type: integer
                      moq:
                        type: integer
      responses:
        '201':
          description: Wholesale order created
        '400':
          description: MOQ validation failure

  /wholesale/orders/{orderId}/hold-escrow:
    post:
      summary: Lock B2B Wholesale Order Funds in Escrow
      tags: [Wholesale B2B]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Escrow locked successfully

  /wholesale/orders/{orderId}/confirm-receipt:
    post:
      summary: Confirm Physical Receipt & Release Escrow Funds to Supplier
      tags: [Wholesale B2B]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                otp:
                  type: string
      responses:
        '200':
          description: Receipt confirmed and escrow released

  # ==========================================
  # DISPUTE & ARBITRATION ROUTES
  # ==========================================
  /disputes:
    post:
      summary: Open a Dispute Case for an Order
      tags: [Disputes]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, reason, description]
              properties:
                orderId:
                  type: string
                reason:
                  type: string
                  enum: [ITEM_NOT_RECEIVED, DAMAGED_GOODS, WRONG_ITEM, INCOMPLETE_ORDER, SLA_BREACH, OTHER]
                description:
                  type: string
                disputedAmount:
                  type: number
      responses:
        '201':
          description: Dispute opened successfully

  /disputes/{disputeId}/evidence:
    post:
      summary: Attach Evidence Files or Chat to Dispute Case
      tags: [Disputes]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: disputeId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                attachments:
                  type: array
                  items:
                    type: object
                    properties:
                      fileUrl:
                        type: string
                      fileType:
                        type: string
      responses:
        '201':
          description: Evidence attached

  /disputes/{disputeId}/arbitrate:
    post:
      summary: Execute Binding Admin Dispute Arbitration (Super Admin Only)
      tags: [Disputes]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: disputeId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [REFUND_BUYER, RELEASE_TO_VENDOR, SPLIT_SETTLEMENT]
                buyerRefundAmount:
                  type: number
                vendorReleaseAmount:
                  type: number
                notes:
                  type: string
      responses:
        '200':
          description: Arbitration decision executed

  # ==========================================
